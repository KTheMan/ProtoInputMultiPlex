name: Rust MCP client
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Standalone client checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: examples/rust-mcp-client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select isolated build directory
        run: |
          $clientTarget = Join-Path $env:RUNNER_TEMP 'protoinputmultiplex-mcp-client-target'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$clientTarget" -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Deterministic tests
        # Real-server tests stay outside CI; never add --ignored here.
        run: cargo test --workspace --locked --lib --test contracts

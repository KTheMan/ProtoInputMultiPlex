name: Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc, wasm32-unknown-unknown
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check native event client feature (Windows)
        run: cargo clippy -p mux-application-sdk --all-targets --features native-client --locked -- -D warnings
      - name: Test native event client feature (no ignored own-window qualification)
        run: cargo test -p mux-application-sdk --all-targets --features native-client --locked
      - name: Check software renderer feature
        run: cargo clippy -p protoinputmultiplex --all-targets --features software-renderer --locked -- -D warnings
      - name: Test software renderer feature (no adapter initialization)
        run: cargo test -p protoinputmultiplex --all-targets --features software-renderer --locked
      - name: Build software renderer feature
        run: cargo build -p protoinputmultiplex --features software-renderer --locked
      - name: Build native workspace (x64)
        run: cargo build --workspace --locked --features mux-application-sdk/native-client --target x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build native workspace (x86)
        run: cargo build --workspace --locked --features mux-application-sdk/native-client --target i686-pc-windows-msvc
      - name: Package each native-client DLL with its matching generated header
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($architecture in @(
            @{ Name = 'x64'; Triple = 'x86_64-pc-windows-msvc' },
            @{ Name = 'x86'; Triple = 'i686-pc-windows-msvc' }
          )) {
            $debugRoot = Join-Path 'target' ($architecture.Triple + '/debug')
            $headers = @(Get-ChildItem -LiteralPath (Join-Path $debugRoot 'build') -Directory -Filter 'mux-application-sdk-*' |
              ForEach-Object { Join-Path $_.FullName 'out/protoinputmultiplex_application_sdk.h' } |
              Where-Object { (Test-Path -LiteralPath $_ -PathType Leaf) -and
                (Select-String -LiteralPath $_ -SimpleMatch 'pim_app_native_completion_handle' -Quiet) })
            if ($headers.Count -eq 0) { throw "No native-client header for $($architecture.Triple)" }
            $headerHashes = @($headers | ForEach-Object {
              (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            } | Sort-Object -Unique)
            if ($headerHashes.Count -ne 1) { throw "Conflicting native-client headers for $($architecture.Triple)" }
            $packageRoot = Join-Path 'target/sdk-preview' $architecture.Name
            New-Item -ItemType Directory -Path $packageRoot -ErrorAction Stop | Out-Null
            $dll = Join-Path $packageRoot 'mux_application_sdk.dll'
            $header = Join-Path $packageRoot 'protoinputmultiplex_application_sdk.h'
            Copy-Item -LiteralPath (Join-Path $debugRoot 'mux_application_sdk.dll') -Destination $dll
            Copy-Item -LiteralPath $headers[0] -Destination $header
            $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            $headerHash = (Get-FileHash -LiteralPath $header -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($headerHash -ne $headerHashes[0]) { throw 'Packaged header digest mismatch' }
            [ordered]@{
              source_commit = $env:GITHUB_SHA
              target = $architecture.Triple
              profile = 'debug'
              features = @('mux-application-sdk/native-client')
              native_client_abi_version = 2
              dll = @{ file = 'mux_application_sdk.dll'; sha256 = $dllHash }
              header = @{ file = 'protoinputmultiplex_application_sdk.h'; sha256 = $headerHash }
              qualification = 'compile-and-unit-tests-only; runtime qualification separate'
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $packageRoot 'metadata.json') -Encoding utf8
          }
      - name: Check Rust browser client
        run: cargo clippy -p mux-application-web --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Build Rust browser client
        run: cargo build -p mux-application-web --locked --target wasm32-unknown-unknown
      - name: Generate matching browser bindings
        shell: pwsh
        run: |
          $bindgenRoot = Join-Path $env:RUNNER_TEMP 'wasm-bindgen-0.2.129'
          New-Item -ItemType Directory -Path $bindgenRoot | Out-Null
          $bindgenArchive = Join-Path $bindgenRoot 'upstream.tar.gz'
          Invoke-WebRequest 'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-pc-windows-msvc.tar.gz' -OutFile $bindgenArchive
          if ((Get-FileHash -LiteralPath $bindgenArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6') { throw 'Upstream binding tool digest mismatch' }
          tar -xzf $bindgenArchive -C $bindgenRoot
          if ($LASTEXITCODE -ne 0) { throw 'Binding tool extraction failed' }
          $bindgenExe = Join-Path $bindgenRoot 'wasm-bindgen-0.2.129-x86_64-pc-windows-msvc/wasm-bindgen.exe'
          $bindgenVersion = & $bindgenExe --version
          if ($LASTEXITCODE -ne 0 -or $bindgenVersion -ne 'wasm-bindgen 0.2.129') { throw 'Binding tool version mismatch' }
          & $bindgenExe --target web --out-dir target/application-web/pkg --out-name mux_application_web target/wasm32-unknown-unknown/debug/mux_application_web.wasm
          if ($LASTEXITCODE -ne 0) { throw 'Browser binding generation failed' }
          Copy-Item crates/mux-application-web/example/index.html,crates/mux-application-web/example/bootstrap.js target/application-web/
      - uses: actions/upload-artifact@v4
        with:
          name: application-sdk-preview-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            target/sdk-preview/
            target/application-web/

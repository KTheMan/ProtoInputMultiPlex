name: Unsigned unreleased build candidate
# Candidate refresh: SDK source accepted at fd12494952197a8e151ef6f3c00d9594c0004b00.

on:
  push:
    branches: [sdk/application-events-20261108, qualification/vm105-ouroboros-home-20261116]
    paths: [.github/workflows/release-candidate.yml]
  workflow_dispatch:
    inputs:
      gui_renderer:
        description: Qualification package renderer (software-dx12 defaults to strict DX12 CPU)
        type: choice
        required: true
        default: glow
        options: [glow, software-dx12]

permissions:
  contents: read

concurrency:
  group: unsigned-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUSTC_WRAPPER: ''
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  GIT_TERMINAL_PROMPT: '0'
  PIM_CANDIDATE_SOURCE_SHA: ${{ github.ref == 'refs/heads/qualification/vm105-ouroboros-home-20261116' && '0f6c377c617e27d81c5622f7a9999895234e8a48' || github.sha }}
  PIM_CANDIDATE_GUI_RENDERER: ${{ github.ref == 'refs/heads/qualification/vm105-ouroboros-home-20261116' && 'software-dx12' || inputs.gui_renderer || 'glow' }}

jobs:
  source-checks:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PIM_CANDIDATE_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Check packaging without compiling or starting the product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import ast,pathlib; names=['package-portable.py','test-package-sdk.py','test-package-sdk-source.py']; [ast.parse((pathlib.Path('scripts')/name).read_text(encoding='utf-8-sig'),filename=name) for name in names]"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging Python syntax rejected.' }
          foreach ($name in @('package-portable.ps1','build-backend.ps1','package-installer.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE "scripts/$name"), [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) { throw "PowerShell syntax rejected: $name" }
          }
          python scripts/test-package-sdk.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging rejection checks failed.' }
          # This check intentionally leaves a rejection probe and prepared vendor
          # files behind. The build job below uses a separate clean checkout.
          python scripts/test-package-sdk-source.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source/header inventory checks failed.' }

  candidate:
    needs: source-checks
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PIM_CANDIDATE_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: i686-pc-windows-msvc, wasm32-unknown-unknown
      - name: Set up MSVC for x64
        shell: pwsh
        run: ./scripts/enter-hosted-msvc.ps1 -Architecture amd64
      - name: Check installed build prerequisites and allocate fresh owned output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:PIM_CANDIDATE_SOURCE_SHA) { throw 'Checkout commit mismatch.' }
          $native = & git -C vendor/ProtoInput rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $native -cne 'dd29bf8d22349605d0e1950c1c5dc4893d72670e') { throw 'Backend pin mismatch.' }
          if ((& git status --porcelain --untracked-files=all)) { throw 'Build requires a clean root checkout.' }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect root checkout.' }
          if ((& git -C vendor/ProtoInput status --porcelain --untracked-files=all)) { throw 'Build requires a clean pinned backend.' }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect backend checkout.' }
          if (Test-Path -LiteralPath 'runtime') { throw 'Prebuilt runtime is not permitted.' }
          $release = 'vendor/ProtoInput/src/ProtoInput/Release'
          if (Test-Path -LiteralPath $release) {
            if (@(Get-ChildItem -LiteralPath $release -File -Recurse | Where-Object { $_.Extension -in '.dll','.exe','.obj','.lib' }).Count) { throw 'Backend build outputs must be absent.' }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsRoot) { throw 'VS 2022/v143 is required.' }
          $atl = @(Get-ChildItem -Path (Join-Path $vsRoot 'VC/Tools/MSVC/*/atlmfc/include/atlbase.h'))
          if (-not $atl.Count) { throw 'Installed C++ ATL is required; no tool download fallback.' }
          $atlRoot = Split-Path -Parent (Split-Path -Parent $atl[0].FullName)
          foreach ($arch in @('x64','x86')) {
            if (-not (Test-Path -LiteralPath (Join-Path $atlRoot "lib/$arch"))) { throw "Missing installed ATL libraries: $arch" }
          }
          $nsisCandidates = @((Join-Path ${env:ProgramFiles(x86)} 'NSIS/Bin/makensis.exe'), (Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'))
          $nsis = @($nsisCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if ($nsis.Count -ne 1) { throw 'Installed NSIS 3 is required.' }
          $root = Join-Path $env:RUNNER_TEMP "pim-unsigned-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Candidate root must be fresh.' }
          New-Item -ItemType Directory -Path $root,(Join-Path $root 'review') | Out-Null
          "PIM_CANDIDATE_ROOT=$root" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIM_MAKENSIS=$($nsis[0])" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          $nsisVersion = & $nsis[0] /VERSION
          if ($LASTEXITCODE -ne 0 -or $nsisVersion -notmatch '^v3\.') { throw 'NSIS 3 version required.' }
          $msbuildVersion = & msbuild -version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild version unavailable.' }
          $tools = [ordered]@{ image_os=$env:ImageOS; image_version=$env:ImageVersion; visual_studio=(Split-Path -Leaf $vsRoot); msvc=$env:VCToolsVersion; windows_sdk=$env:WindowsSDKVersion; msbuild=@($msbuildVersion); nsis=$nsisVersion; rust='1.92.0'; backend_toolset='v143'; backend_sdk='10.0' }
          $tools | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $root 'review/build-tools.json') -Encoding utf8
      - name: Fetch only the official pinned browser binding archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:PIM_CANDIDATE_ROOT 'wasm-bindgen.tar.gz'
          if ($env:GITHUB_REF -ceq 'refs/heads/qualification/vm105-ouroboros-home-20261116') {
            & curl.exe --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-max-time 120 --connect-timeout 15 --max-time 60 --output $archive 'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-pc-windows-msvc.tar.gz'
          } else {
            & curl.exe --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-max-time 120 --connect-timeout 15 --max-time 60 --output $archive --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2026-03-10' 'https://api.github.com/repos/wasm-bindgen/wasm-bindgen/releases/assets/587769522'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Pinned binding archive download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6') { throw 'Pinned binding archive digest mismatch.' }
      - name: Build and stage the full unsigned candidate using accepted packaging scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:PIM_CANDIDATE_ROOT
          & ./scripts/package-portable.ps1 -CargoTargetDir (Join-Path $root 'cargo-target') -OutputDir (Join-Path $root 'portable') -WasmBindgenArchive (Join-Path $root 'wasm-bindgen.tar.gz') -GuiRenderer $env:PIM_CANDIDATE_GUI_RENDERER
          if (-not $?) { throw 'Full release candidate packaging failed.' }
          & ./scripts/package-installer.ps1 -BundleDir (Join-Path $root 'portable') -OutputFile (Join-Path $root 'review/ProtoInputMultiPlex-unsigned-unreleased-setup.exe') -MakeNsis $env:PIM_MAKENSIS
          if (-not $?) { throw 'Unsigned installer packaging failed.' }
      - name: Retain only completed deliverables and sanitized build provenance
        if: github.ref != 'refs/heads/qualification/vm105-ouroboros-home-20261116'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:PIM_CANDIDATE_ROOT
          $review = Join-Path $root 'review'
          $manifest = Get-Content -LiteralPath (Join-Path $root 'portable/bundle-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.source_commit -cne $env:GITHUB_SHA -or -not $manifest.build_inputs_verified) { throw 'Frozen build identity mismatch.' }
          $expectedFeatures = if ($env:PIM_CANDIDATE_GUI_RENDERER -ceq 'software-dx12') { @('software-renderer') } else { @() }
          if ($manifest.application_build.gui_renderer -cne $env:PIM_CANDIDATE_GUI_RENDERER -or
              $manifest.application_build.default_renderer -cne $env:PIM_CANDIDATE_GUI_RENDERER -or
              (@($manifest.application_build.features) -join ',') -cne (@($expectedFeatures) -join ',') -or
              $manifest.application_build.executable_sha256 -cne (Get-FileHash -LiteralPath (Join-Path $root 'portable/protoinputmultiplex.exe') -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Application renderer build identity mismatch.' }
          # Preserve the exact workflow separately: the accepted source ZIP's
          # fixed workflow allowlist is intentionally unchanged.
          Copy-Item -LiteralPath '.github/workflows/release-candidate.yml' -Destination (Join-Path $review 'build-recipe.yml')
          Copy-Item -LiteralPath (Join-Path $root 'portable/bundle-manifest.json') -Destination (Join-Path $review 'bundle-manifest.json')
          Compress-Archive -LiteralPath (Join-Path $root 'portable') -DestinationPath (Join-Path $review 'ProtoInputMultiPlex-unsigned-unreleased-portable.zip') -CompressionLevel Optimal
          $record = [ordered]@{ schema='pim.unsigned-candidate-build.v1'; status='UNSIGNED_UNRELEASED_BUILD_ONLY'; source_commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; repository=$env:GITHUB_REPOSITORY; application_build=$manifest.application_build; wasm_bindgen_asset_api='https://api.github.com/repos/wasm-bindgen/wasm-bindgen/releases/assets/587769522'; wasm_bindgen_archive_sha256='79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6'; qualification='Build/staging/import inventory only. No product launch, installer execution, GUI/native/browser SDK runtime, real devices, real reboot, signing, release publication, legal redistribution clearance or Ultra parity approval.' }
          $record | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $review 'candidate-status.json') -Encoding utf8
          $hashes = @(Get-ChildItem -LiteralPath $review -File | Sort-Object Name | ForEach-Object { [ordered]@{ file=$_.Name; bytes=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          ConvertTo-Json -InputObject $hashes -Depth 5 | Set-Content -LiteralPath (Join-Path $review 'SHA256.json') -Encoding utf8
      - name: Upload unsigned unreleased artifacts for CI review
        if: github.ref != 'refs/heads/qualification/vm105-ouroboros-home-20261116'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-unreleased-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PIM_CANDIDATE_ROOT }}/review/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Hash and encrypt the loose x64 candidate
        if: github.ref == 'refs/heads/qualification/vm105-ouroboros-home-20261116'
        shell: pwsh
        env:
          PIM_REVIEW_RSA_MODULUS: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:PIM_CANDIDATE_ROOT
          $portable = Join-Path $root 'portable'
          $review = Join-Path $root 'review'
          $setupName = 'ProtoInputMultiPlex-unsigned-unreleased-setup.exe'
          $manifestPath = Join-Path $portable 'bundle-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.source_commit -cne $env:PIM_CANDIDATE_SOURCE_SHA -or
              $manifest.protoinput_commit -cne 'dd29bf8d22349605d0e1950c1c5dc4893d72670e' -or
              $manifest.platform -cne 'windows-x64' -or -not $manifest.build_inputs_verified -or
              $manifest.application_build.gui_renderer -cne 'software-dx12' -or
              $manifest.application_build.default_renderer -cne 'software-dx12' -or
              ($manifest.application_build.features -join ',') -cne 'software-renderer') {
            throw 'Unexpected candidate source, runtime, architecture, or renderer.'
          }
          function Measure-File($rootPath, $relative) {
            $file = Get-Item -LiteralPath (Join-Path $rootPath $relative)
            if ($file.PSIsContainer -or $file.Length -le 0) { throw "Incomplete candidate member: $relative" }
            [ordered]@{ path=$relative; bytes=$file.Length; sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $runtimeNames = @(Get-ChildItem -LiteralPath (Join-Path $portable 'runtime') -File -Recurse |
            ForEach-Object { [IO.Path]::GetRelativePath($portable, $_.FullName).Replace('\','/') } | Sort-Object)
          $expectedRuntime = @($manifest.runtime_files | ForEach-Object { "runtime/$_" } | Sort-Object)
          if (-not $runtimeNames.Count -or (Compare-Object $expectedRuntime $runtimeNames -CaseSensitive)) { throw 'Runtime inventory mismatch.' }
          $payload = @(foreach ($relative in (@('protoinputmultiplex.exe') + $runtimeNames)) {
            $item = Measure-File $portable $relative
            $bound = @($manifest.files | Where-Object { $_.path -ceq $relative })
            if ($bound.Count -ne 1 -or $bound[0].bytes -ne $item.bytes -or $bound[0].sha256 -cne $item.sha256) {
              throw "Candidate hash does not match manifest: $relative"
            }
            if ($relative -ceq 'protoinputmultiplex.exe' -and $item.sha256 -cne $manifest.application_build.executable_sha256) {
              throw 'Portable executable does not match the renderer build record.'
            }
            $item.path = "portable/$relative"
            $item
          })
          $payload += Measure-File $review $setupName
          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $review 'bundle-manifest.json')
          $record = [ordered]@{
            schema='pim.vm105-release-candidate.v1'; status='UNSIGNED_UNRELEASED_BUILD_ONLY'
            source_commit=$env:PIM_CANDIDATE_SOURCE_SHA; workflow_commit=$env:GITHUB_WORKFLOW_SHA
            qualification_branch=$env:GITHUB_REF_NAME; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT
            platform=$manifest.platform; protoinput_commit=$manifest.protoinput_commit; application_build=$manifest.application_build
            qualification='Hosted build and integrity checks only. No product or installer execution and no release publication.'
            hashes=$payload
          }
          $tar = Join-Path $root 'candidate-review.tar'
          & tar.exe -cf $tar -C $root portable -C $review $setupName
          if ($LASTEXITCODE -ne 0) { throw 'Could not collect the loose candidate for encrypted review.' }
          $archive = [IO.File]::ReadAllBytes($tar)
          if ($archive.Length -lt 1 -or $archive.Length -gt 536870912) { throw 'Unexpected candidate collection size.' }
          $key = [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $nonce = [Security.Cryptography.RandomNumberGenerator]::GetBytes(12)
          $tag = [byte[]]::new(16)
          $ciphertext = [byte[]]::new($archive.Length)
          $rsa = [Security.Cryptography.RSA]::Create()
          $aes = [Security.Cryptography.AesGcm]::new($key,16)
          try {
            $recipient = [Security.Cryptography.RSAParameters]::new()
            $recipient.Modulus = [Convert]::FromBase64String($env:PIM_REVIEW_RSA_MODULUS)
            $recipient.Exponent = [byte[]]@(1,0,1)
            $rsa.ImportParameters($recipient)
            $wrapped = $rsa.Encrypt($key,[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
            if ($wrapped.Length -ne 384) { throw 'Unexpected review recipient key size.' }
            $aes.Encrypt($nonce,$archive,$ciphertext,$tag)
            $sealed = Join-Path $review 'candidate-review.tar.enc'
            $stream = [IO.File]::Open($sealed,[IO.FileMode]::CreateNew)
            try {
              foreach ($part in @([Text.Encoding]::ASCII.GetBytes('PIMRC1'),$wrapped,$nonce,$tag,$ciphertext)) {
                $stream.Write($part,0,$part.Length)
              }
            } finally { $stream.Dispose() }
            $record.encrypted_review = Measure-File $review 'candidate-review.tar.enc'
          } finally {
            $aes.Dispose()
            $rsa.Dispose()
            [Array]::Clear($key,0,$key.Length)
          }
          $record | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $review 'candidate-status.json') -Encoding utf8NoBOM
          Get-Content -LiteralPath (Join-Path $review 'candidate-status.json') -Raw
      - name: Retain encrypted candidate and hash receipt in Actions
        if: github.ref == 'refs/heads/qualification/vm105-ouroboros-home-20261116'
        uses: actions/upload-artifact@v6
        with:
          name: vm105-x64-software-dx12-review-${{ env.PIM_CANDIDATE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.PIM_CANDIDATE_ROOT }}/review/candidate-review.tar.enc
            ${{ env.PIM_CANDIDATE_ROOT }}/review/candidate-status.json
            ${{ env.PIM_CANDIDATE_ROOT }}/review/bundle-manifest.json
            ${{ env.PIM_CANDIDATE_ROOT }}/review/build-tools.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

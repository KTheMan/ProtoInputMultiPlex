[package]
name = "mux-application-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["native-ffi", "native-windows"]
native-ffi = []
native-client = ["native-ffi", "native-windows", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:windows-sys"]
native-windows = ["dep:mux-windows"]

[dependencies]
mux-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
mux-windows = { workspace = true, optional = true }

tokio = { version = "1", optional = true, features = ["rt", "sync", "net", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
[[example]]
name = "native_dll_lifecycle"
required-features = ["native-client"]

[[example]]
name = "native_external_consumer"
required-features = ["native-client"]

[[example]]
name = "standalone_host_dll_lifecycle"
required-features = ["native-client"]

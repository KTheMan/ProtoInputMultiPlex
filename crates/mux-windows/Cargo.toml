[package]
name = "mux-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
cursor-presentation-evidence = ["dep:serde_json"]

[dependencies]
anyhow.workspace = true
mux-core.workspace = true
serde.workspace = true
cursor-snapshot-protocol = { path = "../cursor-snapshot-protocol" }

[target.'cfg(windows)'.dependencies]
libloading = "0.8.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_HiDpi", "Win32_Storage_Xps", "Win32_System_Power", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }

windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite"] }

[target.'cfg(windows)'.dependencies.serde_json]
workspace = true
optional = true

[dev-dependencies]
serde_json.workspace = true

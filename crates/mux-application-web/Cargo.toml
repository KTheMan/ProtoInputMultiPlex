[package]
name = "mux-application-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mux-application-sdk = { path = "../mux-application-sdk", default-features = false }
mux-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "Node", "Event", "EventTarget", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "CanvasRenderingContext2d", "DomRect", "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "Url", "ResizeObserver"] }

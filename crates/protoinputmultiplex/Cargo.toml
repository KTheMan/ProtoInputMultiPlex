[package]
name = "protoinputmultiplex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "protoinputmultiplex"
path = "src/main.rs"

[features]
cursor-presentation-evidence = ["mux-windows/cursor-presentation-evidence"]

[dependencies]
base64 = "0.22"
anyhow.workspace = true
mux-core.workspace = true
serde_json.workspace = true
serde.workspace = true
clap = { version = "4.6", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
mux-windows.workspace = true
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
ouroboros-ui = { git = "https://github.com/Type-zero-labs/ouroboros-ui", rev = "c390d7deffa7955e28b2e3bcb9c22ac0899a261b" }
image = { version = "0.25", default-features = false, features = ["png"] }
ocrs = { version = "=0.12.2", default-features = false }
rten = { version = "=0.24.0", default-features = false, features = ["rten_format"] }
rten-imageproc = "=0.24.0"
rten-tensor = "=0.24.0"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "sync", "net", "time", "macros", "io-util"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell"] }

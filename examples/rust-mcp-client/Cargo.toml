[package]
name = "protoinputmultiplex-mcp-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

# Deliberately independent of the application workspace and its lockfile.
[workspace]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-async-rw"] }
